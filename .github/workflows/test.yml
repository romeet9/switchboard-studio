name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate template YAML parses
        run: |
          pip install pyyaml
          python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" templates/switchboard-studio.template.yaml
      - run: npm test
